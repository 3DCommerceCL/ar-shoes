<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Shoe Try-On</title>
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- UI AR (visible solo durante uso) -->
  <div id="ui" style="display:none">
    <div id="status-bar">
      <span id="status">Detectando…</span>
    </div>
    <div id="controls">
      <button id="btn-switch-foot" type="button">Pie izquierdo</button>
      <button id="btn-recalibrate" type="button">Reiniciar</button>
      <div id="opacity-control">
        <label for="slider-opacity">Opacidad</label>
        <input id="slider-opacity" type="range" min="0.1" max="1" step="0.05" value="1" />
      </div>
    </div>
  </div>

  <!-- Guía de encuadre (sin calibración: MediaPipe detecta el pie directamente) -->
  <div id="step-2" class="step-screen" style="display:none">
    <div class="step-card step-card--top">
      <div class="step-icon">🦵</div>
      <h2>Mostrá tus piernas y pies</h2>
      <p>Parate y encuadrá <strong>desde las rodillas hasta los pies</strong> — no solo los pies de cerca.</p>
      <p class="step-hint">MediaPipe necesita ver las piernas para ubicar el pie. Alejá un poco la cámara.</p>
    </div>
  </div>

  <!-- Pantalla de carga inicial -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-msg">Cargando visor AR…</p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
